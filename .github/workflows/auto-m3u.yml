name: Auto Update M3U Playlist

on:
  schedule:
    - cron: "0 */6 * * *"   # Cada 6 horas
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install yt-dlp
        run: |
          sudo apt update
          sudo apt install -y python3-pip
          pip install yt-dlp

      - name: Set target URL
        run: echo "TARGET_URL=https://pluto.tv/latam/live-tv/6870072ca9d5c45c3e9466f1" >> $GITHUB_ENV

      - name: Extract stream URLs
        run: |
          yt-dlp -g "$TARGET_URL" > raw_links.txt

      - name: Generate M3U
        run: |
          echo "#EXTM3U" > playlist.m3u
          COUNT=1
          while read line; do
            if echo "$line" | grep -E "\.m3u8|\.mpd" > /dev/null; then
              echo "#EXTINF:-1,Stream $COUNT" >> playlist.m3u
              echo "$line" >> playlist.m3u
              COUNT=$((COUNT+1))
            fi
          done < raw_links.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update playlist"
          git push
