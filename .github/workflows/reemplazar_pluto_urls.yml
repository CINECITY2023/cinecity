name: actualizar_m3u

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ejecutar script
        run: python plutourlxurl.py

      - name: Subir cambios
        run: |
          git config --global user.name "iptv-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add *.m3u
          git commit -m "Actualizacion automatica Pluto"
          git push
