name: Extraer value automático

on:
  schedule:
    - cron: "0 4 * * *"   # una vez al día (04:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Descargar y extraer value
        run: |
          curl -s https://spinoff.link/listas-premium/ | \
          grep -oP 'id="textoParaCopiar1"[^>]*value="\K[^"]+' > resultado.txt

      - name: Commit y push si cambió
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add resultado.txt
          git commit -m "Actualiza value automático" || echo "Sin cambios"
          git push
