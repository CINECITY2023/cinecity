name: Extraer value dinámico

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas (puedes cambiarlo)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Instalar Python y Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Extraer value del input
        run: |
          python <<EOF
          from playwright.sync_api import sync_playwright

          url = "https://spinoff.link/listas-premium/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="networkidle")

              value = page.locator("#textoParaCopiar1").input_value()

              with open("resultado.txt", "w") as f:
                  f.write(value)

              browser.close()
          EOF

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add resultado.txt
          git commit -m "Actualiza texto automáticamente" || echo "Sin cambios"
          git push
