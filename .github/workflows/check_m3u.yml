name: Check M3U Channels

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Download M3U
        run: |
          curl -L "https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/principal.m3u" -o original.m3u

      - name: Check streams
        run: |
          output="principal_checked.m3u"
          > $output

          prev=""

          while IFS= read -r line
          do
            if [[ $line == \#EXTINF* ]]; then
              prev="$line"
            elif [[ $line == http* ]]; then

              echo "Checking $line"

              status=$(curl -Is --max-time 10 "$line" | head -n 1)

              if [[ $status == *"200"* || $status == *"302"* ]]; then
                echo "$prev" >> $output
                echo "$line" >> $output
              else
                broken=$(echo "$prev" | sed 's/^#EXTINF/EXTINF/')
                echo "$broken" >> $output
                echo "$line" >> $output
              fi

            else
              echo "$line" >> $output
            fi
          done < original.m3u

      - name: Commit result
        run: |
          git config --global user.name "m3u-checker"
          git config --global user.email "actions@github.com"
          git add principal_checked.m3u
          git commit -m "Updated checked M3U" || echo "No changes"
          git push
