name: Actualizar codigo TecnoTV en todos los M3U

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Descargar página como navegador real
        run: |
          curl -L \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0 Safari/537.36" \
          -H "Accept-Language: es-ES,es;q=0.9" \
          https://spinoff.link/listas-premium/ \
          -o pagina.html

      - name: Extraer URL TecnoTV
        run: |
          grep -oP 'http://tecnotv\.club/[A-Za-z0-9]+' pagina.html | head -n 1 > nueva_url.txt

      - name: Obtener código nuevo
        run: |
          URL=$(cat nueva_url.txt)
          CODIGO=$(echo $URL | awk -F'/' '{print $4}')
          echo "Código detectado: $CODIGO"
          echo "CODIGO=$CODIGO" >> $GITHUB_ENV

      - name: Reemplazar código en TODOS los M3U
        run: |
          for archivo in *.m3u; do
            echo "Actualizando $archivo"
            sed -i "s|http://tecnotv.club/[^/]*/|http://tecnotv.club/${CODIGO}/|g" "$archivo"
          done

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add *.m3u
          git commit -m "Actualiza codigo TecnoTV automáticamente en todos los M3U" || echo "Sin cambios"
          git push
