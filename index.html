<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>CineCity IPTV</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    #marquee {
      background: #000;
      color: red;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 0;
      overflow: hidden;
      white-space: nowrap;
    }
    #auth input {
      margin: 10px;
      padding: 10px;
      width: 250px;
    }
    #auth button {
      padding: 10px 20px;
      margin: 10px;
    }
    #logout {
      display: none;
      margin: 20px auto;
      padding: 10px 20px;
    }
    video {
      width: 100%;
      max-height: 480px;
      background: #000;
    }
    #search {
      padding: 10px;
      width: 80%;
      max-width: 400px;
      margin: 20px auto;
      font-size: 16px;
      display: none;
    }
    .group {
      margin: 30px 0 10px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #555;
      padding-bottom: 5px;
      width: 90%;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
    .group-channels {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 10px;
      padding: 10px;
      width: 90%;
      margin: auto;
    }
    .channel {
      background: #222;
      border-radius: 6px;
      padding: 5px;
      width: 90px;
      cursor: pointer;
    }
    .channel:hover {
      background: #333;
    }
    .channel img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .channel-name {
      margin-top: 5px;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="marquee">
  <marquee behavior="scroll" direction="left" scrollamount="5">
    🎬 CineCity IPTV — Películas, deportes y más en vivo | Sólo acceso autorizado 📺
  </marquee>
</div>

<div id="auth">
  <input type="email" id="email" placeholder="Correo electrónico" />
  <input type="password" id="password" placeholder="Contraseña" />
  <br>
  <button onclick="login()">Iniciar sesión</button>
  <button onclick="register()">Registrarse</button>
</div>

<button id="logout" onclick="logout()">Cerrar sesión</button>
<video id="player" controls autoplay muted style="display:none;"></video>
<input type="text" id="search" placeholder="Buscar canal..." />
<div id="channels"></div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD-fzfLNG1ZbK1bMWeKRki_eAyagpnw7cg",
    authDomain: "iptv-tokens.firebaseapp.com",
    projectId: "iptv-tokens",
    storageBucket: "iptv-tokens.firebasestorage.app",
    messagingSenderId: "728401298",
    appId: "1:728401298:web:9760cf82d8b00b5679ad4b",
    measurementId: "G-9VG6B4T29F"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  async function getUserIP() {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    return data.ip;
  }

  auth.onAuthStateChanged(async user => {
    if (user) {
      const uid = user.uid;
      const ref = db.collection("usuarios").doc(uid);
      const ipActual = await getUserIP();
      const doc = await ref.get();

      if (!doc.exists) {
        await ref.set({ email: user.email, ip: ipActual });
        mostrarContenido();
      } else if (doc.data().ip === ipActual) {
        mostrarContenido();
      } else {
        alert("❌ Este usuario ya fue usado desde otra IP.");
        auth.signOut();
      }
    }
  });

  function mostrarContenido() {
    document.getElementById("auth").style.display = "none";
    document.getElementById("logout").style.display = "inline-block";
    document.getElementById("player").style.display = "block";
    document.getElementById("search").style.display = "block";
    fetchM3U();
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, password)
      .catch(error => alert("Error: " + error.message));
  }

  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.createUserWithEmailAndPassword(email, password)
      .catch(error => alert("Error: " + error.message));
  }

  function logout() {
    auth.signOut().then(() => location.reload());
  }

  const m3uUrl = "https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/A001.m3u";
  let allChannels = [];
  let groupOrder = [];

  document.getElementById("search").addEventListener("input", renderFiltered);

  function fetchM3U() {
    fetch(m3uUrl)
      .then(res => res.text())
      .then(data => {
        allChannels = parseM3U(data);
        renderFiltered();
      })
      .catch(err => alert("Error al cargar M3U: " + err));
  }

  function parseM3U(text) {
    const lines = text.split("\\n");
    const channels = [];
    const seenGroups = new Set();

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line.startsWith("#EXTINF:")) {
        const name = line.split(",").pop().trim();
        const logo = line.match(/tvg-logo="(.*?)"/)?.[1] || "";
        const group = line.match(/group-title="(.*?)"/)?.[1] || "Sin grupo";
        const url = lines[i + 1]?.trim();
        if (url && url.startsWith("http")) {
          if (!seenGroups.has(group)) {
            groupOrder.push(group);
            seenGroups.add(group);
          }
          channels.push({ name, logo, group, url });
        }
      }
    }
    return channels;
  }

  function renderFiltered() {
    const query = document.getElementById("search").value.toLowerCase();
    const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
    renderGrouped(filtered);
  }

  function renderGrouped(channels) {
    const container = document.getElementById("channels");
    container.innerHTML = "";
    const grouped = {};
    groupOrder.forEach(g => grouped[g] = []);
    channels.forEach(ch => grouped[ch.group]?.push(ch));

    groupOrder.forEach(group => {
      if (!grouped[group]?.length) return;

      const title = document.createElement("div");
      title.className = "group";
      title.textContent = group;

      const groupGrid = document.createElement("div");
      groupGrid.className = "group-channels";

      grouped[group].forEach(canal => {
        const div = document.createElement("div");
        div.className = "channel";
        div.innerHTML = \`
          <img src="\${canal.logo}" onerror="this.style.display='none'">
          <div class="channel-name">\${canal.name}</div>
        \`;
        div.onclick = () => play(canal.url);
        groupGrid.appendChild(div);
      });

      container.appendChild(title);
      container.appendChild(groupGrid);
    });
  }

  function play(url) {
    const video = document.getElementById("player");
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = url;
      video.addEventListener("loadedmetadata", () => video.play());
    } else {
      alert("Tu navegador no soporta HLS");
    }
  }
</script>
</body>
</html>
