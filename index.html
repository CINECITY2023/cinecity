<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>CineCity IPTV</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    #marquee {
      background: #000;
      color: red;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 0;
      overflow: hidden;
      white-space: nowrap;
    }
    #auth input {
      margin: 10px;
      padding: 10px;
      width: 250px;
    }
    #auth button {
      padding: 10px 20px;
      margin: 10px;
    }
    #logout {
      display: none;
      margin: 20px auto;
      padding: 10px 20px;
    }
    video {
      width: 100%;
      max-height: 480px;
      background: #000;
    }
    #search {
      padding: 10px;
      width: 80%;
      max-width: 400px;
      margin: 20px auto;
      font-size: 16px;
      display: none;
    }
    .group {
      margin: 30px 0 10px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #555;
      padding-bottom: 5px;
      width: 90%;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
    .group-channels {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 10px;
      padding: 10px;
      width: 90%;
      margin: auto;
    }
    .channel {
      background: #222;
      border-radius: 6px;
      padding: 5px;
      width: 90px;
      cursor: pointer;
    }
    .channel:hover {
      background: #333;
    }
    .channel img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .channel-name {
      margin-top: 5px;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="marquee">
  <marquee behavior="scroll" direction="left" scrollamount="5">
    🎬 CineCity IPTV — Películas, deportes y más en vivo | Sólo acceso autorizado 📺
  </marquee>
</div>

<div id="auth">
  <input type="email" id="email" placeholder="Correo electrónico" />
  <input type="password" id="password" placeholder="Contraseña" />
  <br>
  <button onclick="login()">Iniciar sesión</button>
  <button onclick="register()">Registrarse</button>
</div>

<button id="logout" onclick="logout()">Cerrar sesión</button>
<video id="player" controls autoplay muted style="display:none;"></video>
<input type="text" id="search" placeholder="Buscar canal..." />
<div id="channels"></div>
