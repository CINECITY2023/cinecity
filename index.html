<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor IPTV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    #player {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      background: #000;
    }

    input[type="text"] {
      padding: 10px;
      width: 90%;
      max-width: 500px;
      margin-bottom: 30px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
     
    select#fondoSelector {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
	
    #canales {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .canal {
      text-align: center;
      cursor: pointer;
      width: 100px;
      transition: transform 0.2s;
    }

    .canal img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 8px;
      transition: transform 0.2s;
    }

    .canal.highlight img {
      transform: scale(1.1); /* Aumentar el tamaño del logo del canal destacado */
    }

    .canal.selected img {
      /* Se eliminó el borde azul para el canal seleccionado */
    }

    .canal span {
      display: block;
      margin-top: 5px;
      font-size: 0.9rem;
    }

    .grupo {
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>
<body>

  <h1>Reproductor IPTV</h1>

  <iframe id="player" src="https://television-libre.tv/html/fl/?get=QW1lcmljYTI0" title="Reproductor" allowfullscreen allow="autoplay; encrypted-media"></iframe>

  <div class="top-bar">
    <input type="text" id="buscador" placeholder="Buscar canal o grupo...">
    <select id="fondoSelector">
      <option value="#f5f5f5">Fondo Claro</option>
      <option value="#1e1e1e">Fondo Oscuro</option>
      <option value="#003366">Azul Marino</option>
      <option value="#faf0e6">Beige</option>
    </select>
  </div>

  <div id="canales">
    <div class="canal" onclick="cambiarCanal(0)" data-url="https://television-libre.tv/html/fl/?get=QW1lcmljYVRW">
        <img src="https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/logos/buenos-aires/ultratv-america.png" alt="Canal 2">
        <span>América TV</span>
        <span class="grupo">Buenos Aires</span>
      </div>
      <div class="canal" onclick="cambiarCanal(1)" data-url="https://television-libre.tv/html/fl/?get=Q2FuYWw3">
        <img src="https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/logos/buenos-aires/TVPublica.png" alt="Canal 7">
        <span>TV Publica</span>
        <span class="grupo">Buenos Aires</span>
      </div>
      <div class="canal" onclick="cambiarCanal(2)" data-url="https://television-libre.tv/html/fl/?get=Q2FuYWw5&lang=1">
        <img src="https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/logos/buenos-aires/ElNueve.png" alt="Canal 9">
        <span>El Nueve</span>
        <span class="grupo">Buenos Aires</span>
      </div>
      <div class="canal" onclick="cambiarCanal(3)" data-url="https://television-libre.tv/html/fl/?get=VGVsZWZlSEQ=">
        <img src="https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/logos/buenos-aires/TELEFE.png" alt="Canal 11">
        <span>Telefe</span>
        <span class="grupo">Buenos Aires</span>
      </div>
      <div class="canal" onclick="cambiarCanal(4)" data-url="https://television-libre.tv/html/fl/?get=QXJ0ZWFySEQ">
        <img src="https://raw.githubusercontent.com/CINECITY2023/cinecity/refs/heads/cinecity.net/logos/buenos-aires/ElTrece.png" alt="Canal 13">
        <span>El Trece</span>
        <span class="grupo">Buenos Aires</span>
      </div>
      <!-- Agrega más canales aquí -->
  </div>

  <script>
    const player = document.getElementById('player');
    const canales = document.querySelectorAll('.canal');
    let canalActual = 0;

    function cambiarCanal(index) {
      // Remover la selección del canal actual
      canales[canalActual].classList.remove('selected');
      canalActual = index; // Actualizar el índice del canal actual
      player.src = canales[canalActual].getAttribute('data-url'); // Cambiar la URL del reproductor
      canales[canalActual].classList.add('selected'); // Resaltar el nuevo canal seleccionado
    }

    // Manejar teclas de dirección
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') {
        // Remover el resaltado del canal actual antes de avanzar
        canales[canalActual].classList.remove('highlight');
        canalActual = (canalActual + 1) % canales.length; // Avanzar al siguiente canal
        canales[canalActual].classList.add('highlight'); // Resaltar el nuevo canal
      } else if (event.key === 'ArrowLeft') {
        // Remover el resaltado del canal actual antes de retroceder
        canales[canalActual].classList.remove('highlight');
        canalActual = (canalActual - 1 + canales.length) % canales.length; // Retroceder al canal anterior
        canales[canalActual].classList.add('highlight'); // Resaltar el nuevo canal
      }
      // Actualizar el reproductor con la URL del canal actual
      player.src = canales[canalActual].getAttribute('data-url');
    });

    const buscador = document.getElementById('buscador');

    buscador.addEventListener('input', () => {
      const filtro = buscador.value.toLowerCase();
      canales.forEach(canal => {
        const nombre = canal.querySelector('span').innerText.toLowerCase();
        const grupo = canal.querySelector('.grupo')?.innerText.toLowerCase() || '';
        canal.style.display = (nombre.includes(filtro) || grupo.includes(filtro)) ? 'block' : 'none';
      });
    });
	
	// Cambiar color de fondo
    const fondoSelector = document.getElementById('fondoSelector');
    fondoSelector.addEventListener('change', () => {
      document.body.style.background = fondoSelector.value;
    });

    // Inicializar el primer canal como seleccionado
    cambiarCanal(canalActual);
    canales[canalActual].classList.add('highlight'); // Resaltar el canal inicial
  </script>

</body>
</html>
