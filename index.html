<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba de Login CineCity</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; text-align:center; padding:50px">

<h2>Login de prueba</h2>

<div id="auth">
  <input type="email" id="email" placeholder="Correo electrónico" /><br><br>
  <input type="password" id="password" placeholder="Contraseña" /><br><br>
  <button onclick="login()">Iniciar sesión</button>
  <button onclick="register()">Registrarse</button>
</div>

<button id="logout" onclick="logout()" style="display:none; margin-top:20px;">Cerrar sesión</button>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD-fzfLNG1ZbK1bMWeKRki_eAyagpnw7cg",
    authDomain: "iptv-tokens.firebaseapp.com",
    projectId: "iptv-tokens",
    storageBucket: "iptv-tokens.firebasestorage.app",
    messagingSenderId: "728401298",
    appId: "1:728401298:web:9760cf82d8b00b5679ad4b",
    measurementId: "G-9VG6B4T29F"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  window.login = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        alert("✅ Sesión iniciada");
        document.getElementById("auth").style.display = "none";
        document.getElementById("logout").style.display = "inline-block";
      })
      .catch(error => alert("❌ Error: " + error.message));
  }

  window.register = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(() => alert("✅ Usuario registrado"))
      .catch(error => alert("❌ Error: " + error.message));
  }

  window.logout = function() {
    auth.signOut().then(() => location.reload());
  }
</script>

</body>
</html>
